name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Run clang-format style check for C++ sources.
      uses: jidicula/clang-format-action@v4.18.0
      with:
        clang-format-version: '16'

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: pip install meson ninja
      - name: Compile a consumer against the staged installation
        working-directory: .
        run: |
          meson setup build --prefix=/opt/libnpy
          meson install -C build --destdir "$RUNNER_TEMP/stage"
          export PKG_CONFIG_LIBDIR="$RUNNER_TEMP/stage/opt/libnpy/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$RUNNER_TEMP/stage"
          cflags=$(pkg-config --cflags libnpy)
          c++ -std=c++14 $cflags -x c++ -o "$RUNNER_TEMP/consumer" - <<'EOF'
          #include <npy.hpp>
          int main() { return npy::npy_data<double>{}.data.empty() ? 0 : 1; }
          EOF
          "$RUNNER_TEMP/consumer"
      - run: meson setup builddir/
        env:
          CC: gcc
      - run: pip install numpy
      - run: meson test -C builddir/ -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Linux_Meson_Testlog
          path: tests/builddir/meson-logs/testlog.txt



